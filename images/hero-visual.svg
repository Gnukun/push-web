<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFF7ED" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="brandOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#E84118" />
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Filters / Shadows -->
    <filter id="shadowMain" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowPhone" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="4" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowFloat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Ambient Background Aura -->
  <rect x="20" y="20" width="640" height="480" rx="32" fill="url(#bgGlow)" />
  <circle cx="540" cy="110" r="130" fill="#FFEDD5" opacity="0.6" filter="blur(30px)"/>
  <circle cx="120" cy="420" r="140" fill="#DBEAFE" opacity="0.6" filter="blur(30px)"/>

  <!-- ==================== PC LAPTOP DISPLAY ==================== -->
  <g transform="translate(60, 60)" filter="url(#shadowMain)">
    <!-- Laptop Lid / Screen Bezel -->
    <rect x="0" y="0" width="460" height="295" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Web Camera Dot -->
    <circle cx="230" cy="7" r="2.5" fill="#475569"/>

    <!-- Screen Display Area (Web page representation) -->
    <g transform="translate(10, 14)">
      <rect x="0" y="0" width="440" height="270" rx="4" fill="#FFFFFF"/>

      <!-- Browser Bar -->
      <rect x="0" y="0" width="440" height="26" fill="#F1F5F9"/>
      <circle cx="14" cy="13" r="3.5" fill="#EF4444"/>
      <circle cx="26" cy="13" r="3.5" fill="#F59E0B"/>
      <circle cx="38" cy="13" r="3.5" fill="#10B981"/>
      <rect x="80" y="5" width="280" height="16" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="140" y="17" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">https://yourshop.com/demo</text>

      <!-- Website Content Header -->
      <rect x="0" y="26" width="440" height="42" fill="#FFFFFF" stroke="#F1F5F9"/>
      <!-- Shop Logo -->
      <rect x="20" y="36" width="22" height="22" rx="6" fill="#FF6B35"/>
      <text x="50" y="52" font-family="'Noto Sans JP', sans-serif" font-weight="800" font-size="12" fill="#1E293B">CAFE &amp; ROASTERY</text>
      <!-- Nav items -->
      <rect x="230" y="44" width="34" height="6" rx="3" fill="#94A3B8"/>
      <rect x="274" y="44" width="34" height="6" rx="3" fill="#94A3B8"/>
      <rect x="318" y="44" width="34" height="6" rx="3" fill="#94A3B8"/>
      <rect x="364" y="37" width="60" height="20" rx="10" fill="#E84118"/>
      <text x="376" y="51" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF">ご予約</text>

      <!-- Website Hero Banner in Screen -->
      <g transform="translate(18, 78)">
        <rect x="0" y="0" width="404" height="110" rx="8" fill="#F8FAFC"/>
        <!-- Photo placeholder -->
        <rect x="210" y="10" width="180" height="90" rx="6" fill="#E2E8F0"/>
        <path d="M240 75L275 45L315 75L350 52L385 75" stroke="#CBD5E1" stroke-width="2" fill="none"/>
        <circle cx="260" cy="35" r="8" fill="#FCD34D"/>

        <!-- Hero text in shop site -->
        <text x="18" y="34" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#0F172A">こだわりの自家焙煎珈琲と、</text>
        <text x="18" y="54" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#0F172A">心地よい空間をお届けします。</text>
        <rect x="18" y="66" width="140" height="6" rx="3" fill="#CBD5E1"/>
        <rect x="18" y="76" width="100" height="6" rx="3" fill="#E2E8F0"/>

        <!-- Shop CTA Button -->
        <rect x="18" y="86" width="70" height="18" rx="9" fill="#0F172A"/>
        <text x="32" y="99" font-family="system-ui, sans-serif" font-weight="700" font-size="8" fill="#FFFFFF">メニューを見る</text>
      </g>

      <!-- Website 3 Feature Cards in Screen -->
      <g transform="translate(18, 198)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="126" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle cx="20" cy="18" r="8" fill="#FFEDD5"/>
        <rect x="35" y="15" width="60" height="6" rx="3" fill="#475569"/>
        <rect x="12" y="34" width="102" height="4" rx="2" fill="#94A3B8"/>
        <rect x="12" y="44" width="80" height="4" rx="2" fill="#CBD5E1"/>

        <!-- Card 2 -->
        <rect x="139" y="0" width="126" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle cx="159" cy="18" r="8" fill="#DBEAFE"/>
        <rect x="174" y="15" width="60" height="6" rx="3" fill="#475569"/>
        <rect x="151" y="34" width="102" height="4" rx="2" fill="#94A3B8"/>
        <rect x="151" y="44" width="80" height="4" rx="2" fill="#CBD5E1"/>

        <!-- Card 3 -->
        <rect x="278" y="0" width="126" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <circle cx="298" cy="18" r="8" fill="#DCFCE7"/>
        <rect x="313" y="15" width="60" height="6" rx="3" fill="#475569"/>
        <rect x="290" y="34" width="102" height="4" rx="2" fill="#94A3B8"/>
        <rect x="290" y="44" width="80" height="4" rx="2" fill="#CBD5E1"/>
      </g>
    </g>

    <!-- Laptop Base / Keyboard deck -->
    <path d="M-40 295 L500 295 L530 310 L-70 310 Z" fill="#94A3B8"/>
    <path d="M-70 310 L530 310 L520 316 L-60 316 Z" fill="#64748B"/>
    <rect x="195" y="295" width="70" height="4" rx="2" fill="#475569"/>
  </g>

  <!-- ==================== SMARTPHONE DISPLAY (FOREGROUND) ==================== -->
  <g transform="translate(420, 150)" filter="url(#shadowPhone)">
    <!-- Smartphone Frame -->
    <rect x="0" y="0" width="190" height="330" rx="28" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <!-- Speaker & Camera Notch -->
    <rect x="65" y="8" width="60" height="12" rx="6" fill="#1E293B"/>
    <circle cx="115" cy="14" r="2.5" fill="#334155"/>

    <!-- Screen Area -->
    <g transform="translate(8, 26)">
      <rect x="0" y="0" width="174" height="294" rx="18" fill="#FFFFFF"/>

      <!-- Mobile Web Top Bar -->
      <rect x="0" y="0" width="174" height="34" fill="#FFFFFF" stroke="#F1F5F9"/>
      <rect x="12" y="10" width="16" height="16" rx="4" fill="#FF6B35"/>
      <text x="34" y="22" font-family="'Noto Sans JP', sans-serif" font-weight="800" font-size="9" fill="#0F172A">CAFE ROAST</text>
      <!-- Hamburger Icon -->
      <rect x="144" y="13" width="16" height="2" rx="1" fill="#334155"/>
      <rect x="144" y="17" width="16" height="2" rx="1" fill="#334155"/>
      <rect x="144" y="21" width="16" height="2" rx="1" fill="#334155"/>

      <!-- Mobile Hero Section -->
      <rect x="0" y="34" width="174" height="110" fill="#FFF7ED"/>
      <text x="12" y="58" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="11" fill="#0F172A">心地よい時間を、</text>
      <text x="12" y="74" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="11" fill="#0F172A">最高の一杯とともに。</text>
      <rect x="12" y="84" width="110" height="4" rx="2" fill="#CBD5E1"/>

      <!-- Call to Action button on Mobile -->
      <rect x="12" y="102" width="90" height="24" rx="12" fill="#E84118"/>
      <text x="24" y="117" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF">WEB予約・案内</text>

      <!-- Shop Photo thumbnail -->
      <rect x="110" y="88" width="52" height="44" rx="6" fill="#FDBA74"/>
      <circle cx="136" cy="106" r="10" fill="#EA580C" opacity="0.6"/>

      <!-- Mobile Content Cards -->
      <g transform="translate(10, 154)">
        <rect x="0" y="0" width="154" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="12" y="18" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="9" fill="#1E293B">おすすめメニュー</text>
        <text x="12" y="30" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748B">看板ブレンド珈琲 &amp; スイーツ</text>
        <circle cx="138" cy="20" r="10" fill="#FFEDD5"/>
        <path d="M135 17L141 20L135 23" stroke="#EA580C" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <g transform="translate(10, 202)">
        <rect x="0" y="0" width="154" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="12" y="18" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="9" fill="#1E293B">営業時間・アクセス</text>
        <text x="12" y="30" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748B">駅から徒歩3分 / 10:00〜19:00</text>
        <circle cx="138" cy="20" r="10" fill="#DBEAFE"/>
        <path d="M135 17L141 20L135 23" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Bottom Navigation Bar for Mobile -->
      <rect x="0" y="254" width="174" height="40" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="18" y="260" width="138" height="26" rx="13" fill="#1E293B"/>
      <text x="48" y="277" font-family="'Noto Sans JP', sans-serif" font-weight="800" font-size="9" fill="#FFFFFF">今すぐ店舗に電話</text>
    </g>
  </g>

  <!-- ==================== FLOATING HIGHLIGHT BADGES ==================== -->
  <!-- Floating Badge 1: デモ制作 0円 -->
  <g transform="translate(25, 45)" filter="url(#shadowFloat)">
    <rect x="0" y="0" width="180" height="58" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="12" y="12" width="34" height="34" rx="10" fill="#DCFCE7"/>
    <!-- Checkmark SVG -->
    <path d="M22 29L27 34L36 24" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" font-family="'Noto Sans JP', sans-serif" font-weight="600" font-size="10" fill="#64748B">契約前の完成確認</text>
    <text x="56" y="44" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#16A34A">デモ制作 0円</text>
  </g>

  <!-- Floating Badge 2: 最短5時間 -->
  <g transform="translate(390, 45)" filter="url(#shadowFloat)">
    <rect x="0" y="0" width="175" height="58" rx="14" fill="#FFFFFF" stroke="#FED7AA"/>
    <rect x="12" y="12" width="34" height="34" rx="10" fill="#FFEDD5"/>
    <!-- Lightning / Speed Icon -->
    <path d="M29 18L23 29L28 29L27 40L35 28L30 28Z" fill="#EA580C"/>
    <text x="54" y="27" font-family="'Noto Sans JP', sans-serif" font-weight="600" font-size="10" fill="#64748B">スピーディー対応</text>
    <text x="54" y="44" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" fill="#EA580C">最短5時間納品</text>
  </g>

  <!-- Floating Badge 3: 制作 10,000円〜 -->
  <g transform="translate(48, 385)" filter="url(#shadowFloat)">
    <rect x="0" y="0" width="205" height="62" rx="14" fill="#0F172A" stroke="#334155"/>
    <rect x="12" y="14" width="34" height="34" rx="10" fill="#1E293B"/>
    <text x="22" y="37" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#F59E0B">¥</text>
    <text x="56" y="30" font-family="'Noto Sans JP', sans-serif" font-weight="500" font-size="10.5" fill="#94A3B8">小規模店舗のための低価格</text>
    <text x="56" y="48" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF">本制作 10,000円〜</text>
  </g>
</svg>
