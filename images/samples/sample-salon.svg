<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="salonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" fill="#F8FAFC"/>

  <!-- Browser Window Wrapper -->
  <rect x="20" y="20" width="560" height="360" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <path d="M20 32 A 12 12 0 0 1 32 20 L568 20 A 12 12 0 0 1 580 32 L580 56 L20 56 Z" fill="#F1F5F9"/>
  <circle cx="42" cy="38" r="4" fill="#EF4444"/>
  <circle cx="56" cy="38" r="4" fill="#F59E0B"/>
  <circle cx="70" cy="38" r="4" fill="#10B981"/>
  <rect x="110" y="28" width="380" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="210" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">demo-salon.push-web.jp</text>

  <!-- Website Content Area -->
  <g transform="translate(20, 56)">
    <!-- Site Navigation -->
    <rect width="560" height="46" fill="#FFFFFF" stroke="#F1F5F9"/>
    <text x="30" y="28" font-family="'Didot', 'Noto Serif JP', serif" font-weight="700" font-size="16" letter-spacing="1.5" fill="#292524">Lino hair &amp; spa</text>
    <text x="280" y="28" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#78716C">STYLE</text>
    <text x="340" y="28" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#78716C">MENU</text>
    <text x="400" y="28" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#78716C">STAFF</text>
    <rect x="460" y="10" width="80" height="26" rx="13" fill="#0D9488"/>
    <text x="476" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF">WEB予約</text>

    <!-- Hero Section -->
    <rect y="46" width="560" height="154" fill="url(#salonBg)"/>
    <text x="40" y="95" font-family="'Noto Serif JP', serif" font-weight="700" font-size="18" fill="#292524">髪と心を整える、プライベートサロン。</text>
    <text x="40" y="122" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#78716C">完全マンツーマン施術。大人女性のための頭皮と髪質改善ケア。</text>
    <rect x="40" y="142" width="120" height="32" rx="16" fill="#292524"/>
    <text x="56" y="162" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">施術メニューを見る</text>

    <!-- Visual showcase card -->
    <rect x="360" y="62" width="170" height="120" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <rect x="372" y="74" width="146" height="70" rx="6" fill="#E2E8F0"/>
    <circle cx="445" cy="100" r="18" fill="#A8A29E"/>
    <path d="M430 118 C430 110 460 110 460 118 Z" fill="#78716C"/>
    <text x="382" y="162" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="9" fill="#0D9488">★ 口コミ評価 4.9 (120件)</text>

    <!-- Feature 3 Columns -->
    <g transform="translate(30, 215)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="154" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#292524">カット＆ヘッドスパ</text>
      <text x="12" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#0D9488">¥7,700 (税込)</text>
      <text x="12" y="58" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#78716C">極上のオーガニックスパ付</text>

      <!-- Item 2 -->
      <rect x="173" y="0" width="154" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="185" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#292524">髪質改善トリートメント</text>
      <text x="185" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#0D9488">¥9,900 (税込)</text>
      <text x="185" y="58" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#78716C">手触りと艶が持続する人気No.1</text>

      <!-- Item 3 -->
      <rect x="346" y="0" width="154" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="358" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#292524">サロンのご案内</text>
      <text x="358" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#1E293B">完全予約制・個室あり</text>
      <text x="358" y="58" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#78716C">定休日: 毎週火曜日・第3水曜</text>
    </g>
  </g>
</svg>
