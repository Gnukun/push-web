<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" fill="#F8FAFC"/>

  <!-- Browser Window Wrapper -->
  <rect x="20" y="20" width="560" height="360" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <path d="M20 32 A 12 12 0 0 1 32 20 L568 20 A 12 12 0 0 1 580 32 L580 56 L20 56 Z" fill="#F1F5F9"/>
  <circle cx="42" cy="38" r="4" fill="#EF4444"/>
  <circle cx="56" cy="38" r="4" fill="#F59E0B"/>
  <circle cx="70" cy="38" r="4" fill="#10B981"/>
  <rect x="110" y="28" width="380" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="205" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">demo-seitai.push-web.jp</text>

  <!-- Website Content Area -->
  <g transform="translate(20, 56)">
    <!-- Site Navigation -->
    <rect width="560" height="46" fill="#FFFFFF" stroke="#F1F5F9"/>
    <!-- Clinic Cross/Heart Icon -->
    <rect x="30" y="14" width="18" height="18" rx="4" fill="#16A34A"/>
    <path d="M39 17 V29 M33 23 H45" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="56" y="28" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="15" fill="#0F172A">ひだまり整体整骨院</text>
    <text x="300" y="28" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748B">当院の特徴</text>
    <text x="370" y="28" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748B">施術料金</text>
    <text x="430" y="28" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748B">アクセス</text>
    <rect x="490" y="10" width="55" height="26" rx="13" fill="#2563EB"/>
    <text x="502" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#FFFFFF">LINE予約</text>

    <!-- Hero Section -->
    <rect y="46" width="560" height="154" fill="url(#clinicBg)"/>
    <rect x="40" y="66" width="90" height="20" rx="10" fill="#DCFCE7"/>
    <text x="50" y="80" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="9.5" fill="#166534">国家資格者常駐</text>
    <text x="40" y="112" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="17" fill="#0F172A">繰り返す肩こり・腰痛の根本改善へ。</text>
    <text x="40" y="134" font-family="'Noto Sans JP', sans-serif" font-size="10.5" fill="#475569">痛みのない優しい骨盤矯正。土日も19時まで受付。</text>
    <rect x="40" y="152" width="120" height="30" rx="15" fill="#16A34A"/>
    <text x="52" y="171" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="10.5" fill="#FFFFFF">初回限定WEBクーポン</text>

    <!-- Medical trust badge -->
    <rect x="360" y="64" width="170" height="116" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="375" y="78" width="140" height="36" rx="6" fill="#F0FDF4"/>
    <text x="385" y="94" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="9" fill="#166534">【初回限定】骨盤バランス矯正</text>
    <text x="385" y="107" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#15803D">¥3,980 <tspan font-size="9" fill="#94A3B8" text-decoration="line-through">¥7,000</tspan></text>
    <text x="375" y="132" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#64748B">✔︎ 痛くないオーダーメイド施術</text>
    <text x="375" y="146" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#64748B">✔︎ お子様連れ・ベビーカーOK</text>
    <text x="375" y="160" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#64748B">✔︎ 駐車場3台完備</text>

    <!-- Feature 3 Columns -->
    <g transform="translate(30, 215)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="154" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#0F172A">骨盤・姿勢矯正</text>
      <text x="12" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#16A34A">根本原因からアプローチ</text>
      <text x="12" y="58" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#64748B">デスクワークの疲労・歪みに</text>

      <!-- Item 2 -->
      <rect x="173" y="0" width="154" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="185" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#0F172A">産後骨盤矯正</text>
      <text x="185" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#16A34A">産後ママ応援コース</text>
      <text x="185" y="58" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#64748B">バウンサー・キッズスペース有</text>

      <!-- Item 3 -->
      <rect x="346" y="0" width="154" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="358" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#0F172A">受付時間・地図</text>
      <text x="358" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#2563EB">土日祝も営業中</text>
      <text x="358" y="58" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#64748B">中央駅東口より徒歩5分</text>
    </g>
  </g>
</svg>
