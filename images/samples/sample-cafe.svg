<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cafeHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" fill="#F8FAFC"/>

  <!-- Browser Window Wrapper -->
  <rect x="20" y="20" width="560" height="360" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <path d="M20 32 A 12 12 0 0 1 32 20 L568 20 A 12 12 0 0 1 580 32 L580 56 L20 56 Z" fill="#F1F5F9"/>
  <circle cx="42" cy="38" r="4" fill="#EF4444"/>
  <circle cx="56" cy="38" r="4" fill="#F59E0B"/>
  <circle cx="70" cy="38" r="4" fill="#10B981"/>
  <rect x="110" y="28" width="380" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="210" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">demo-cafe.push-web.jp</text>

  <!-- Website Content Area -->
  <g transform="translate(20, 56)">
    <!-- Site Navigation -->
    <rect width="560" height="46" fill="#FFFFFF" stroke="#F1F5F9"/>
    <text x="30" y="28" font-family="'Noto Sans JP', serif" font-weight="900" font-size="15" fill="#451A03">SUNNY COFFEE ROASTERS</text>
    <text x="290" y="28" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#78350F">CONCEPT</text>
    <text x="360" y="28" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#78350F">MENU</text>
    <text x="415" y="28" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#78350F">ACCESS</text>
    <rect x="480" y="10" width="60" height="26" rx="13" fill="#D97706"/>
    <text x="495" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF">テイクアウト</text>

    <!-- Hero Section -->
    <rect y="46" width="560" height="154" fill="url(#warmBg)"/>
    <text x="40" y="95" font-family="'Noto Sans JP', serif" font-weight="900" font-size="18" fill="#451A03">日常に、深呼吸できる一杯を。</text>
    <text x="40" y="122" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#78350F">厳選した豆を店内でじっくり焙煎。心地よい音楽とともに。</text>
    <rect x="40" y="142" width="110" height="32" rx="16" fill="#78350F"/>
    <text x="58" y="162" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">メニュー一覧</text>

    <!-- Coffee illustration badge -->
    <rect x="360" y="62" width="170" height="120" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
    <circle cx="445" cy="115" r="34" fill="#FEF3C7"/>
    <!-- Coffee cup icon -->
    <path d="M430 110 L434 132 C435 136 455 136 456 132 L460 110 Z" fill="#78350F"/>
    <path d="M458 114 C464 114 466 126 458 126" stroke="#78350F" stroke-width="3" fill="none"/>
    <path d="M436 100 C436 96 440 96 440 92" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M444 102 C444 98 448 98 448 94" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="400" y="162" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="9" fill="#92400E">自家焙煎 / Wi-Fi・電源完備</text>

    <!-- Feature 3 Columns -->
    <g transform="translate(30, 215)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="154" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="12" y="10" width="24" height="24" rx="6" fill="#FEF3C7"/>
      <text x="44" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#1E293B">本日の珈琲</text>
      <text x="44" y="34" font-family="system-ui, sans-serif" font-size="9" fill="#D97706">¥550〜</text>
      <text x="12" y="54" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#64748B">日替わりシングルオリジン</text>

      <!-- Item 2 -->
      <rect x="173" y="0" width="154" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="185" y="10" width="24" height="24" rx="6" fill="#FEF3C7"/>
      <text x="217" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#1E293B">自家製スコーン</text>
      <text x="217" y="34" font-family="system-ui, sans-serif" font-size="9" fill="#D97706">¥420</text>
      <text x="185" y="54" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#64748B">発酵バター香る焼きたて</text>

      <!-- Item 3 -->
      <rect x="346" y="0" width="154" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="358" y="10" width="24" height="24" rx="6" fill="#DCFCE7"/>
      <text x="390" y="24" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11" fill="#1E293B">店舗情報</text>
      <text x="390" y="34" font-family="system-ui, sans-serif" font-size="9" fill="#16A34A">駅から徒歩4分</text>
      <text x="358" y="54" font-family="'Noto Sans JP', sans-serif" font-size="8.5" fill="#64748B">営業時間: 8:00〜19:00</text>
    </g>
  </g>
</svg>
