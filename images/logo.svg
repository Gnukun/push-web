<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#E84118" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#E84118" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Symbol Icon: Modern interactive push badge -->
  <g transform="translate(10, 12)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#logoGrad)" filter="url(#badgeShadow)"/>
    <!-- Concentric wave indicator -->
    <path d="M22 17C26 14 32 14 36 17" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45"/>
    <path d="M18 22L36 34L18 46" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="34" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography: プッシュ！ -->
  <g transform="translate(78, 48)">
    <text font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="url(#textGrad)">
      プッシュ<tspan fill="#E84118">！</tspan>
    </text>
    <text y="17" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2" fill="#64748B">
      WEB PRODUCTION
    </text>
  </g>
</svg>
